<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate Discord-ready party hosting messages.">
  <title>Party Texter</title>
  <script>
    // Apply saved/system theme before first paint to avoid a flash.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('party-texter-theme'); } catch (error) {}
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <h1 class="nav-title">Party Texter</h1>
      <label class="nav-hardcore" title="Hardcore parties have 3 player slots">
        <input type="checkbox" id="Hardcore-Mode" class="switch">
        <span class="nav-hardcore-label">Hardcore</span>
      </label>
    </div>
    <button class="nav-theme-toggle" id="Theme-Toggle" type="button" aria-label="Toggle dark theme"></button>
  </nav>

  <main class="card main-card">
    <section class="field-group">
      <label class="field-label" for="Strategy-Name">Strategy Name <span class="required" aria-hidden="true">*</span></label>
      <input id="Strategy-Name" class="text-box" type="text" placeholder="e.g. Alpha Hosting" autocomplete="off" required aria-describedby="Strategy-Name-Error">
      <p class="field-error" id="Strategy-Name-Error" role="alert"></p>
    </section>

    <section class="field-group">
      <label class="field-label" for="Strategy-Link">Strategy Link <span class="required" aria-hidden="true">*</span></label>
      <input id="Strategy-Link" class="text-box" type="text" inputmode="url" placeholder="https://..." autocomplete="off" required aria-describedby="Strategy-Link-Error">
      <p class="field-error" id="Strategy-Link-Error" role="alert"></p>
    </section>

    <section class="field-group field-wide">
      <label class="field-label" for="Requirements">Requirements</label>
      <textarea id="Requirements" class="text-box textarea" placeholder="List the requirements here..."></textarea>
    </section>

    <section class="player-group">
      <div class="player-header">
        <h2 class="section-heading">Players</h2>
        <span class="player-summary" id="Player-Summary"></span>
      </div>
      <p class="hint">Tick a slot to mark it as taken.</p>
      <div class="player-grid" id="Player-Container"></div>
    </section>
  </main>

  <div class="button-row">
    <button class="button primary" type="button" id="Submit">Submit <kbd>Ctrl + Enter</kbd></button>
    <button class="button secondary" type="button" id="Copy">Copy</button>
    <button class="button danger" type="button" id="Clear">Clear</button>
  </div>

  <section class="output-section card">
    <div class="output-header">
      <h2 class="output-heading">Output Text</h2>
      <div class="output-tabs" role="tablist" aria-label="Output view">
        <button type="button" class="tab is-active" role="tab" aria-selected="true" data-view="preview">Preview</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-view="raw">Raw</button>
      </div>
    </div>
    <div class="output-block" id="output-container--" aria-live="polite">
      <div id="output-1" class="output-preview">
        <p class="output-empty">Fill in the form and press Submit to generate your message.</p>
      </div>
    </div>
  </section>

  <div class="toast" id="Toast" role="status" aria-live="polite"></div>

  <script src="index.js"></script>
</body>
</html>
