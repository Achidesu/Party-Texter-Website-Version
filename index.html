<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Texter</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');
  </style>
</head>
<body>
  <nav class="nav">
    <h1 class="nav-title">Party Texter</h1>
    <button class="nav-theme-toggle" id="Theme-Toggle" type="button" aria-label="Toggle dark theme">Dark Theme</button>
  </nav>

  <main class="card main-card">
    <section class="field-group">
      <label class="field-label" for="Strategy-Name">Strategy Name</label>
      <input id="Strategy-Name" class="text-box" type="text" placeholder="e.g. Alpha Hosting">
    </section>

    <section class="field-group">
      <label class="field-label" for="Strategy-Link">Strategy Link</label>
      <input id="Strategy-Link" class="text-box" type="text" placeholder="https://...">
    </section>

    <section class="field-group">
      <label class="field-label" for="Requirements">Requirements</label>
      <textarea id="Requirements" class="text-box textarea" placeholder="List the requirements here..."></textarea>
    </section>

    <section class="player-group">
      <h2 class="section-heading">Players</h2>
      <div class="player-grid" id="Player-Container">
        <label class="player-check">
          <input type="checkbox" id="Player-1" class="check-box">
          <span class="player-label">Player 1</span>
        </label>
        <label class="player-check">
          <input type="checkbox" id="Player-2" class="check-box">
          <span class="player-label">Player 2</span>
        </label>
        <label class="player-check">
          <input type="checkbox" id="Player-3" class="check-box">
          <span class="player-label">Player 3</span>
        </label>
        <label class="player-check">
          <input type="checkbox" id="Player-4" class="check-box">
          <span class="player-label">Player 4</span>
        </label>
      </div>
    </section>
  </main>



  <div class="button-row">
    <button class="button primary" type="button" id="Submit">Submit</button>
    <button class="button secondary" type="button" id="Copy">Copy</button>
    <button class="button danger" type="button" id="Clear">Clear</button>
  </div>

  <section class="output-section card">
    <div class="output-header">
      <h2 class="output-heading">Output Text</h2>
    </div>
    <div class="output-block" id="output-container--">
      <p id="output-1"></p>
    </div>
  </section>

  <script src="index.js"></script>
<script>
  (function () {
    const themeToggle = document.getElementById('Theme-Toggle');
    const body = document.body;

    function updateTheme(theme) {
      if (theme === 'dark') {
        body.classList.add('dark-theme');
        themeToggle.textContent = 'Light Theme';
      } else {
        body.classList.remove('dark-theme');
        themeToggle.textContent = 'Dark Theme';
      }
      try {
        localStorage.setItem('party-texter-theme', theme);
      } catch (error) {
        // ignore storage errors
      }
    }

    const saved = (function () {
      try {
        return localStorage.getItem('party-texter-theme');
      } catch (error) {
        return null;
      }
    })();

    if (saved === 'dark') {
      updateTheme('dark');
    }

    if (themeToggle) {
      themeToggle.addEventListener('click', function () {
        const isDark = body.classList.contains('dark-theme');
        updateTheme(isDark ? 'light' : 'dark');
      });
    }
  })();
</script>
</body>
</html>
